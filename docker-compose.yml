services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./workspace:/app/workspace", "./case:/app/case", "./.harness:/app/.harness"]
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
  ui:
    build: .
    env_file: .env
    ports: ["8501:8501"]
    volumes: ["./workspace:/app/workspace", "./case:/app/case", "./.harness:/app/.harness"]
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    restart: unless-stopped
